name: llm_analogs_vs_minimal
description: "LLM agents with precise strategy prompts vs minimal-info LLM, 100 rounds, prisoners dilemma"
repetitions: 1

defaults:
  game: prisoners_dilemma
  num_rounds: 100
  model:
    model: openrouter/elephant-alpha
    base_url: https://openrouter.ai/api/v1
    api_key: $OPENROUTER_API_KEY
    temperature: 0.0

runs:
  - id: always_cooperate_vs_minimal
    agent_a:
      prompt: always_cooperate_llm
    agent_b:
      prompt: minimal

  - id: always_defect_vs_minimal
    agent_a:
      prompt: always_defect_llm
    agent_b:
      prompt: minimal

  - id: suspicious_tft_llm_vs_minimal
    agent_a:
      prompt: suspicious_tit_for_tat_llm
    agent_b:
      prompt: minimal
